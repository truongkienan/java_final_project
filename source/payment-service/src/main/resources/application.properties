# Negative testing (PayPal-Mock-Response header) - để trống khi không test.
# Đặt = INSTRUMENT_DECLINED để giả lập capture thất bại do thẻ/nguồn tiền bị từ chối (bao gồm cả
# case "hết tiền" - PayPal mô tả rộng là "instrument declined by processor/bank"). Yêu cầu bật
# "Negative Testing" cho tài khoản Business Sandbox tại developer.paypal.com > Sandbox > Accounts
# > (tài khoản Business) > View/Edit Account > Settings > Negative Testing = On - nếu không PayPal
# sẽ trả 403 Forbidden (rỗng) thay vì lỗi giả lập mong muốn.
# LƯU Ý: đã test thực tế - "INSUFFICIENT_FUNDS" luôn bị PayPal từ chối 403 ở endpoint
# v2/checkout/orders/{id}/capture (giới hạn từ PayPal, không phải lỗi cấu hình) - đừng dùng lại.
