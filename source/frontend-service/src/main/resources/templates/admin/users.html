<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/_layout}">

<head>
    <title>Quản lý tài khoản - Admin</title>
</head>

<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <h1 class="mt-4">Quản lý tài khoản</h1>
        <a th:href="@{/admin/users/new}" class="btn btn-primary mb-3">Thêm tài khoản mới</a>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
            <li class="breadcrumb-item active">Quản lý tài khoản</li>
        </ol>

        <div class="card mb-4">
            <div class="card-header">
                <i class="fas fa-table mr-1"></i> Danh sách tài khoản
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="u : ${users}">
                            <td th:text="${u.id}">1</td>
                            <td th:text="${u.username}">username</td>
                            <td><span class="badge badge-info" th:text="${u.roleName}">ROLE</span></td>
                            <td>
                                <span th:if="${u.active}" class="badge badge-success">Active</span>
                                <span th:unless="${u.active}" class="badge badge-secondary">Đã thu hồi</span>
                            </td>
                            <td>
                                <a th:href="@{/admin/users/edit/{id}(id=${u.id})}"
                                   class="btn btn-sm btn-primary">Đổi Role</a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>
