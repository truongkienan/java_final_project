<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{admin/_layout}">

<head>
    <title>Quản lý Role - Admin</title>
</head>

<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <h1 class="mt-4">Role & Permission</h1>
        <a th:href="@{/admin/roles/new}" class="btn btn-primary mb-3">Thêm Role mới</a>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Dashboard</a></li>
            <li class="breadcrumb-item active">Role & Permission</li>
        </ol>

        <div class="card mb-4">
            <div class="card-header">
                <i class="fas fa-table mr-1"></i> Danh sách Role
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên Role</th>
                            <th>Mô tả</th>
                            <th>Permission</th>
                            <th>Hành động</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="role : ${roles}">
                            <td th:text="${role.roleId}">1</td>
                            <td th:text="${role.roleName}">ROLE_ADMIN</td>
                            <td th:text="${role.description}">Mô tả</td>
                            <td>
                                <span th:each="perm : ${role.permissions}" class="badge badge-info mr-1"
                                      th:text="${perm.permissionName}">PERMISSION</span>
                            </td>
                            <td>
                                <a th:href="@{/admin/roles/edit/{id}(id=${role.roleId})}"
                                   class="btn btn-sm btn-primary">Edit</a>
                                <form th:action="@{/admin/roles/delete/{id}(id=${role.roleId})}"
                                      method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-sm btn-danger"
                                            onclick="return confirm('Bạn có chắc chắn muốn xóa Role này?')">Xóa</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>
