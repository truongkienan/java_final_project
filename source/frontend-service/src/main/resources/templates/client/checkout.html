<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{client/_layout}">

<head>
    <title>Checkout - BigStore</title>
</head>

<body>
<div layout:fragment="content">
    <!--banner-->
    <div class="banner-top">
        <div class="container">
            <h3>Checkout</h3>
            <h4><a th:href="@{/}">Home</a><label>/</label>Checkout</h4>
            <div class="clearfix"> </div>
        </div>
    </div>

    <div class="login">
        <div class="main-agileits">
            <div class="form-w3agile form-w3agile1">
                <h3>Confirm Order</h3>

                <div th:if="${param.error != null and param.error[0] == 'order_failed'}" class="alert alert-danger">
                    Unable to create order. Please try again.
                </div>
                <div th:if="${param.error != null and param.error[0] == 'payment_failed'}" class="alert alert-danger">
                    Unable to initiate PayPal payment. Please try again.
                </div>
                <div th:if="${param.error != null and param.error[0] == 'out_of_stock'}" class="alert alert-danger">
                    Sorry, some items in your order are out of stock or the system is busy. Please try again.
                </div>

                <table class="table" style="width:100%; color:#333; margin-bottom:20px;">
                    <thead>
                    <tr>
                        <th>Product</th>
                        <th>Unit Price</th>
                        <th>Quantity</th>
                        <th>Subtotal</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${cart.items}">
                        <td th:text="${item.productName}"></td>
                        <td><sup>VND</sup> <span th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')}"></span></td>
                        <td th:text="${item.quantity}"></td>
                        <td><sup>VND</sup> <span th:text="${#numbers.formatDecimal(item.price * item.quantity, 0, 'COMMA', 0, 'POINT')}"></span></td>
                    </tr>
                    </tbody>
                </table>

                <h4 style="text-align:right;">Total: <strong><sup>VND</sup> <span th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')}"></span></strong></h4>

                <form th:action="@{/checkout/pay}" method="post" style="text-align:right; margin-top:20px;">
                    <input type="submit" value="Pay with PayPal">
                </form>
            </div>
        </div>
    </div>
</div>
</body>

</html>
