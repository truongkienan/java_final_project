<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{client/_layout}">

<head>
    <title>Thanh toán - BigStore</title>
</head>

<body>
<div layout:fragment="content">
    <!--banner-->
    <div class="banner-top">
        <div class="container">
            <h3>Checkout</h3>
            <h4><a th:href="@{/}">Home</a><label>/</label>Checkout</h4>
            <div class="clearfix"> </div>
        </div>
    </div>

    <div class="login">
        <div class="main-agileits">
            <div class="form-w3agile form-w3agile1">
                <h3>Xác nhận đơn hàng</h3>

                <div th:if="${param.error != null and param.error[0] == 'order_failed'}" class="alert alert-danger">
                    Không thể tạo đơn hàng. Vui lòng thử lại.
                </div>
                <div th:if="${param.error != null and param.error[0] == 'payment_failed'}" class="alert alert-danger">
                    Không thể khởi tạo thanh toán PayPal. Vui lòng thử lại.
                </div>
                <div th:if="${param.error != null and param.error[0] == 'out_of_stock'}" class="alert alert-danger">
                    Rất tiếc, một số sản phẩm trong đơn hàng đã hết hàng hoặc hệ thống đang bận. Vui lòng thử lại.
                </div>

                <table class="table" style="width:100%; color:#333; margin-bottom:20px;">
                    <thead>
                    <tr>
                        <th>Sản phẩm</th>
                        <th>Đơn giá</th>
                        <th>Số lượng</th>
                        <th>Thành tiền</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="item : ${cart.items}">
                        <td th:text="${item.productName}"></td>
                        <td th:text="${'$' + item.price}"></td>
                        <td th:text="${item.quantity}"></td>
                        <td th:text="${'$' + (item.price * item.quantity)}"></td>
                    </tr>
                    </tbody>
                </table>

                <h4 style="text-align:right;">Tổng cộng: <strong th:text="${'$' + total}"></strong></h4>

                <form th:action="@{/checkout/pay}" method="post" style="text-align:right; margin-top:20px;">
                    <input type="submit" value="Pay with PayPal">
                </form>
            </div>
        </div>
    </div>
</div>
</body>

</html>
