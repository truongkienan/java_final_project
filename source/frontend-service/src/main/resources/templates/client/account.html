<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{client/_layout}">

<head>
    <title>My Account - BigStore</title>
</head>

<body>
<div layout:fragment="content">
    <!--banner-->
    <div class="banner-top">
        <div class="container">
            <h3>My Account</h3>
            <h4><a th:href="@{/}">Home</a><label>/</label>Account</h4>
            <div class="clearfix"> </div>
        </div>
    </div>

    <div class="login">
        <div class="main-agileits" style="width:90%; max-width:1100px;">
            <div class="form-w3agile form-w3agile1">
                <h3>Hello, <span th:text="${username}"></span></h3>

                <h4 style="margin-top:30px;">Order History</h4>

                <div th:if="${orderMessage}" class="alert alert-success" style="color: green;" th:text="${orderMessage}"></div>
                <div th:if="${orderError}" class="alert alert-danger" th:text="${orderError}"></div>

                <div th:if="${orders.isEmpty()}">
                    <p>You have no orders yet.</p>
                </div>

                <table th:unless="${orders.isEmpty()}" class="table" style="width:100%; color:#333; margin-top:15px;">
                    <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Order Date</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="${#strings.substring(order.id, 0, 8)}"></td>
                        <td th:text="${#strings.substring(order.orderDate, 0, 10)}"></td>
                        <td th:text="${order.details.size()}"></td>
                        <td><sup>VND</sup> <span th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')}"></span></td>
                        <td th:text="${order.status == 'FAILED'} ? 'PAYMENT FAILED' : ${order.status}"></td>
                        <td>
                            <a th:href="@{/account/orders/{id}(id=${order.id})}" class="btn btn-sm btn-info">View</a>
                            <form th:if="${order.status == 'PENDING'}" th:action="@{/account/orders/{id}/cancel(id=${order.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Cancel this order?')">Cancel Order</button>
                            </form>
                            <form th:if="${order.status == 'PAID'}" th:action="@{/account/orders/{id}/request-refund(id=${order.id})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-sm btn-warning" onclick="return confirm('Request a refund for this order?')">Request Refund</button>
                            </form>
                            <span th:if="${order.status == 'REFUND_REQUESTED'}" style="font-style:italic; color:#888;">Refund pending approval</span>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <nav th:if="${totalPages > 1}" aria-label="Order history pages">
                    <ul class="pagination" style="margin-top:10px;">
                        <li th:classappend="${currentPage == 0} ? 'disabled'">
                            <a th:href="@{/account(page=${currentPage - 1})}" aria-label="Previous"><span aria-hidden="true">&laquo;</span></a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                            <a th:href="@{/account(page=${i})}" th:text="${i + 1}"></a>
                        </li>
                        <li th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a th:href="@{/account(page=${currentPage + 1})}" aria-label="Next"><span aria-hidden="true">&raquo;</span></a>
                        </li>
                    </ul>
                </nav>

                <h4 style="margin-top:30px;">Shipping Addresses</h4>

                <div th:if="${addresses.isEmpty()}">
                    <p>You haven't saved any addresses yet.</p>
                </div>

                <table th:unless="${addresses.isEmpty()}" class="table" style="width:100%; color:#333; margin-top:15px;">
                    <thead>
                    <tr>
                        <th>Address</th>
                        <th>Phone Number</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="addr : ${addresses}">
                        <td th:text="${addr.addressName}"></td>
                        <td th:text="${addr.phone}"></td>
                        <td>
                            <form th:action="@{/account/addresses/delete/{id}(id=${addr.addressId})}" method="post" style="display:inline;">
                                <button type="submit" class="btn btn-sm btn-danger"
                                        onclick="return confirm('Delete this address?')">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <form th:action="@{/account/addresses/add}" method="post" style="max-width:400px; margin-top:15px;">
                    <div class="key">
                        <i class="fa fa-map-marker" aria-hidden="true"></i>
                        <input type="text" name="addressName" placeholder="Detailed address" required="">
                        <div class="clearfix"></div>
                    </div>
                    <div class="key">
                        <i class="fa fa-phone" aria-hidden="true"></i>
                        <input type="text" name="phone" placeholder="Phone number" required="">
                        <div class="clearfix"></div>
                    </div>
                    <input type="submit" value="Add Address">
                </form>

                <h4 style="margin-top:30px;">Change Password</h4>

                <div th:if="${passwordMessage}" class="alert alert-success" style="color: green;" th:text="${passwordMessage}"></div>
                <div th:if="${passwordError}" class="alert alert-danger" th:text="${passwordError}"></div>

                <form th:action="@{/account/change-password}" method="post" style="max-width:400px; margin-top:15px;">
                    <div class="key">
                        <i class="fa fa-lock" aria-hidden="true"></i>
                        <input type="password" name="oldPassword" placeholder="Current password" required="">
                        <div class="clearfix"></div>
                    </div>
                    <div class="key">
                        <i class="fa fa-lock" aria-hidden="true"></i>
                        <input type="password" name="newPassword" placeholder="New password" required="">
                        <div class="clearfix"></div>
                    </div>
                    <input type="submit" value="Change Password">
                </form>
            </div>
        </div>
    </div>
</div>
</body>

</html>
