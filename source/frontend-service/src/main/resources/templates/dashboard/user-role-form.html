<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{dashboard/_layout}">

<head>
    <title>Change User Role - Admin</title>
</head>

<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <h1 class="mt-4">Change User Role</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a th:href="@{/dashboard/users}">User List</a></li>
            <li class="breadcrumb-item active">Change Role</li>
        </ol>

        <div class="card mb-4" style="max-width: 500px;">
            <div class="card-body">
                <form th:action="@{/dashboard/users/save}" th:object="${user}" method="post">
                    <input type="hidden" th:field="*{id}" />

                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" class="form-control" th:field="*{username}" readonly />
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select class="form-control" th:field="*{roleId}">
                            <option th:each="r : ${allRoles}" th:value="${r.roleId}" th:text="${r.roleName}"></option>
                        </select>
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" th:field="*{active}" />
                        <label class="form-check-label">Active (uncheck to revoke login access)</label>
                    </div>

                    <button type="submit" class="btn btn-success">Save</button>
                    <a th:href="@{/dashboard/users}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>

</html>
