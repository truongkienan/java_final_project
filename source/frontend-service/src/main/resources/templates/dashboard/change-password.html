<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{dashboard/_layout}">

<head>
    <title>Đổi mật khẩu - Admin</title>
</head>

<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <h1 class="mt-4">Đổi mật khẩu</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item active">Đổi mật khẩu</li>
        </ol>

        <div class="alert alert-success" th:if="${passwordMessage}" th:text="${passwordMessage}"></div>
        <div class="alert alert-danger" th:if="${passwordError}" th:text="${passwordError}"></div>

        <div class="card mb-4" style="max-width: 500px;">
            <div class="card-body">
                <form th:action="@{/dashboard/change-password}" method="post">
                    <div class="form-group">
                        <label>Mật khẩu hiện tại</label>
                        <input type="password" class="form-control" name="oldPassword" required />
                    </div>
                    <div class="form-group">
                        <label>Mật khẩu mới</label>
                        <input type="password" class="form-control" name="newPassword" required minlength="6" />
                    </div>
                    <button type="submit" class="btn btn-success">Đổi mật khẩu</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>

</html>
