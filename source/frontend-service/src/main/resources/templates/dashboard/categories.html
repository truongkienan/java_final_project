<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{dashboard/_layout}">

<head>
    <title>Category Management - Admin</title>
</head>

<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <h1 class="mt-4">Categories</h1>
        <a th:href="@{/dashboard/categories/new}" class="btn btn-primary mb-3">Add New Category</a>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
            <li class="breadcrumb-item active">Categories</li>
        </ol>

        <div class="card mb-4">
            <div class="card-header">
                <i class="fas fa-table mr-1"></i> Category List
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Category Name</th>
                            <th>Parent Category</th>
                            <th>Image</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="cat : ${categories}">
                            <td th:text="${cat.categoryId}">1</td>
                            <td>
                                        <span th:style="${cat.parentId == null} ? 'font-weight:bold;' : 'padding-left:25px;'"
                                              th:text="${cat.parentId != null ? '↳ ' : ''} + ${cat.categoryName}">Category Name</span>
                            </td>
                            <td th:text="${cat.parentName != null ? cat.parentName : '— (Top level)'}">—</td>
                            <td>
                                <img th:if="${cat.imageUrl != null}" th:src="${cat.imageUrl}"
                                     style="width: 50px; height: 50px; object-fit: cover;" />
                            </td>
                            <td>
                                <span th:if="${cat.active}" class="badge badge-success">Active</span>
                                <span th:unless="${cat.active}" class="badge badge-secondary">Hidden</span>
                            </td>
                            <td>
                                <a th:href="@{/dashboard/categories/edit/{id}(id=${cat.categoryId})}"
                                   class="btn btn-sm btn-primary">Edit</a>
                                <form th:action="@{/dashboard/categories/delete/{id}(id=${cat.categoryId})}"
                                      method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-sm btn-danger"
                                            onclick="return confirm('Are you sure you want to delete this category?')">Delete</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>
