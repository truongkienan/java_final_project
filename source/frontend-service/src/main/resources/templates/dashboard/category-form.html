<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{dashboard/_layout}">

<head>
    <title>Category Form - Admin</title>
</head>

<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <h1 class="mt-4" th:text="${category.categoryId == null ? 'Add New Category' : 'Update Category'}">Form
        </h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a th:href="@{/dashboard/categories}">Category List</a></li>
            <li class="breadcrumb-item active">Form</li>
        </ol>

        <div class="card mb-4" style="max-width: 600px;">
            <div class="card-body">
                <form th:action="@{/dashboard/categories/save}" th:object="${category}" method="post">
                    <input type="hidden" th:field="*{categoryId}" />

                    <div class="form-group">
                        <label>Category Name</label>
                        <input type="text" class="form-control" th:field="*{categoryName}" required />
                    </div>
                    <div class="form-group">
                        <label>Slug (URL-friendly, no diacritics, words separated by "-")</label>
                        <input type="text" class="form-control" th:field="*{slug}" required />
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Image URL</label>
                        <input type="text" class="form-control" th:field="*{imageUrl}" />
                    </div>
                    <div class="form-group">
                        <label>Parent Category (leave blank for top-level category)</label>
                        <select class="form-control" th:field="*{parentId}">
                            <option value="">-- None (top-level category) --</option>
                            <option th:each="p : ${parentCategories}" th:value="${p.categoryId}"
                                    th:text="${p.categoryName}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Display Order</label>
                        <input type="number" class="form-control" th:field="*{position}" />
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" th:field="*{active}" />
                        <label class="form-check-label">Visible (Active)</label>
                    </div>

                    <button type="submit" class="btn btn-success">Save</button>
                    <a th:href="@{/dashboard/categories}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>

</html>
