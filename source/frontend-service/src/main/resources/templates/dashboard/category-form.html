<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{dashboard/_layout}">

<head>
    <title>Form Danh mục - Admin</title>
</head>

<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <h1 class="mt-4" th:text="${category.categoryId == null ? 'Thêm mới Danh mục' : 'Cập nhật Danh mục'}">Form
        </h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a th:href="@{/dashboard/categories}">Danh sách Danh mục</a></li>
            <li class="breadcrumb-item active">Form</li>
        </ol>

        <div class="card mb-4" style="max-width: 600px;">
            <div class="card-body">
                <form th:action="@{/dashboard/categories/save}" th:object="${category}" method="post">
                    <input type="hidden" th:field="*{categoryId}" />

                    <div class="form-group">
                        <label>Tên danh mục</label>
                        <input type="text" class="form-control" th:field="*{categoryName}" required />
                    </div>
                    <div class="form-group">
                        <label>Slug (đường dẫn, viết liền không dấu, cách nhau bằng "-")</label>
                        <input type="text" class="form-control" th:field="*{slug}" required />
                    </div>
                    <div class="form-group">
                        <label>Mô tả</label>
                        <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Đường dẫn hình ảnh</label>
                        <input type="text" class="form-control" th:field="*{imageUrl}" />
                    </div>
                    <div class="form-group">
                        <label>Danh mục cha (để trống nếu là danh mục cấp 1)</label>
                        <select class="form-control" th:field="*{parentId}">
                            <option value="">-- Không có (danh mục cấp 1) --</option>
                            <option th:each="p : ${parentCategories}" th:value="${p.categoryId}"
                                    th:text="${p.categoryName}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Thứ tự hiển thị</label>
                        <input type="number" class="form-control" th:field="*{position}" />
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" class="form-check-input" th:field="*{active}" />
                        <label class="form-check-label">Hiển thị (Active)</label>
                    </div>

                    <button type="submit" class="btn btn-success">Lưu dữ liệu</button>
                    <a th:href="@{/dashboard/categories}" class="btn btn-secondary">Hủy bỏ</a>
                </form>
            </div>
        </div>
    </div>
</div>
</body>

</html>
