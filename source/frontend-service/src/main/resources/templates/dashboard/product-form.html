<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{dashboard/_layout}">

<head>
    <title>Product Form - Admin</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="container-fluid">
            <h1 class="mt-4" th:text="${product.productId == null ? 'Add New Product' : 'Update Product'}">Form
            </h1>
            <ol class="breadcrumb mb-4">
                <li class="breadcrumb-item"><a th:href="@{/dashboard/products}">Product List</a></li>
                <li class="breadcrumb-item active">Form</li>
            </ol>

            <div class="card mb-4" style="max-width: 600px;">
                <div class="card-body">
                    <form th:action="@{/dashboard/products/save}" th:object="${product}" method="post">
                        <input type="hidden" th:field="*{productId}" />

                        <div class="form-group">
                            <label>Product Name</label>
                            <input type="text" class="form-control" th:field="*{productName}" required />
                        </div>
                        <div class="form-group">
                            <label>Price (VND)</label>
                            <input type="number" step="1000" class="form-control" th:field="*{unitPrice}" />
                        </div>
                        <div class="form-group">
                            <label>Image URL</label>
                            <input type="text" class="form-control" th:field="*{imageUrl}" />
                        </div>

                        <button type="submit" class="btn btn-success">Save</button>
                        <a th:href="@{/dashboard/products}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
