<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{dashboard/_layout}">

<head>
    <title>Order Management - Admin</title>
</head>

<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <h1 class="mt-4">Orders</h1>
        <ol class="breadcrumb mb-4">
            <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
            <li class="breadcrumb-item active">Orders</li>
        </ol>

        <div th:if="${orderMessage}" class="alert alert-success" th:text="${orderMessage}"></div>
        <div th:if="${orderError}" class="alert alert-danger" th:text="${orderError}"></div>

        <div class="card mb-4">
            <div class="card-header">
                <i class="fas fa-table mr-1"></i> Order List
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
                        <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Order Date</th>
                            <th>Items</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="order : ${orders}">
                            <td th:text="${#strings.substring(order.id, 0, 8)}">abcd1234</td>
                            <td th:text="${order.memberId}">user123</td>
                            <td th:text="${#strings.substring(order.orderDate, 0, 10)}">2026-08-15</td>
                            <td th:text="${order.details.size()}">1</td>
                            <td><span th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')}"></span> <sup>VND</sup></td>
                            <td>
                                <span th:if="${order.status == 'PAID'}" class="badge badge-success" th:text="${order.status}">PAID</span>
                                <span th:if="${order.status == 'PENDING'}" class="badge badge-warning" th:text="${order.status}">PENDING</span>
                                <span th:if="${order.status == 'CANCELLED'}" class="badge badge-danger" th:text="${order.status}">CANCELLED</span>
                                <span th:if="${order.status == 'FAILED'}" class="badge badge-dark" th:text="${order.status}">FAILED</span>
                                <span th:if="${order.status == 'REFUND_REQUESTED'}" class="badge badge-info" th:text="${order.status}">REFUND_REQUESTED</span>
                                <span th:if="${order.status == 'REFUNDED'}" class="badge badge-secondary" th:text="${order.status}">REFUNDED</span>
                            </td>
                            <td>
                                <form th:if="${order.status == 'PENDING'}" th:action="@{/dashboard/orders/{id}/cancel(id=${order.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Cancel this order?')">Cancel Order</button>
                                </form>
                                <form th:if="${order.status == 'PAID'}" th:action="@{/dashboard/orders/{id}/refund(id=${order.id})}" method="post" style="display:inline;">
                                    <button type="submit" class="btn btn-sm btn-warning" onclick="return confirm('Refund this order?')">Refund</button>
                                </form>
                                <span th:if="${order.status == 'REFUND_REQUESTED'}">
                                    <form th:action="@{/dashboard/orders/{id}/refund(id=${order.id})}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-sm btn-warning" onclick="return confirm('Approve refund for this order?')">Approve Refund</button>
                                    </form>
                                    <form th:action="@{/dashboard/orders/{id}/reject-refund(id=${order.id})}" method="post" style="display:inline;">
                                        <button type="submit" class="btn btn-sm btn-secondary" onclick="return confirm('Reject this refund request?')">Reject</button>
                                    </form>
                                </span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>
