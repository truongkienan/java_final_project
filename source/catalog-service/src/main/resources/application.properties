# Thông tin cấu hình Server (chạy ở cổng 8081 để không đụng với service khác)
server.port=8081
spring.application.name=catalog-service

# Cấu hình SQL Server (Thay đổi username, password và tên database tương ứng với máy bạn)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=EcommerceDB;encrypt=true;trustServerCertificate=true;
# spring.datasource.url=jdbc:sqlserver://mssql-clusterip-srv:1433;databaseName=EcommerceDB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
# spring.datasource.password=pa55w0rd!
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate ddl-auto: update sẽ tự động tạo bảng nếu bảng chưa có trong database
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
